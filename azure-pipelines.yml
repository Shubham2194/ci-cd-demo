trigger:
- main

pool:
  name: 'private-pool'
  demands:
  - agent.name -equals antino

variables:
  gkeCluster: 'proview-dev-gke'
  gkeZone: 'asia-southeast1'
  gkeProject: 'endless-elysium-402509'
  helmChartRepo: 'https://github.com/Shubham2194/ci-cd-demo.git'
  helmChartPath: 'nginx'
  helmReleaseName: 'nginx-release'
  namespace: 'backend'

stages:
- stage: Deploy
  jobs:
  - job: Deploy
    pool:
      name: 'private-pool'
    steps:
    - script: |
        sudo apt-get update
        sudo apt-get install -y apt-transport-https ca-certificates gnupg
        curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add -
        echo "deb https://apt.kubernetes.io/ kubernetes-xenial main" | sudo tee -a /etc/apt/sources.list.d/kubernetes.list
        sudo apt-get update
        sudo apt-get install -y kubectl
      displayName: 'Install kubectl'

    - script: |
        curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash
      displayName: 'Install Helm'

    - script: |
        echo $$GCLOUD_SERVICE_KEY > gcloud-service-key.json
        gcloud auth activate-service-account --key-file=gcloud-service-key.json
        gcloud container clusters get-credentials $(gkeCluster) --zone $(gkeZone) --project $(gkeProject)
      displayName: 'Configure gcloud'
      env:
        GCLOUD_SERVICE_KEY: $(gcloudServiceConnection)

    - script: |
        git clone $(helmChartRepo) helm-chart
      displayName: 'Clone Helm Chart Repository'

    - script: |
        helm upgrade --install $(helmReleaseName) helm-chart/$(helmChartPath) --namespace $(namespace)
      displayName: 'Deploy Helm Chart'
